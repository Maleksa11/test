<style>
:root{--bg:#f4f5f7;--fg:#15161a;--card:#fff;--mut:#5d6068;--bd:#d9dbe1;--ac:#e8264f;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0e11;--fg:#f1f2f5;--card:#181a1f;--mut:#9ba0ab;--bd:#2a2d35;--ac:#ff4468;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e11;--fg:#f1f2f5;--card:#181a1f;--mut:#9ba0ab;--bd:#2a2d35;--ac:#ff4468;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
#setup{max-width:440px;margin:0 auto;padding:44px 22px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box;justify-content:center}
.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#ff4468,#ff8a3d);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(255,68,104,.35);margin-bottom:6px}
.logo svg{width:32px;height:32px;fill:#fff}
h1{font-size:27px;line-height:1.35;margin:0;font-weight:800;letter-spacing:-.2px}
p{margin:0;color:var(--mut);line-height:1.7;font-size:15px}
#setup[hidden]{display:none}
#lang{align-self:flex-end;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
html[dir=ltr] #list{direction:ltr}
html[dir=ltr] .row.cur{box-shadow:inset 3px 0 0 var(--ac)}
input,textarea{font:inherit;font-size:16px;padding:15px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--fg);direction:ltr;text-align:left;width:100%;box-sizing:border-box;resize:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,68,104,.18)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#go,#paste{font:inherit;font-weight:700;font-size:17px;padding:16px;border:0;border-radius:16px;color:#fff;transition:transform .1s}
#go{background:linear-gradient(135deg,#ff4468,#ff7a45);box-shadow:0 8px 22px rgba(255,68,104,.3)}
#paste{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
#go:active,#paste:active{transform:scale(.98)}
#err{color:var(--ac);min-height:22px;font-size:14px}
.tip{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--mut)}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;direction:ltr;touch-action:none;z-index:5}
#slide{position:absolute;inset:0}
#slide iframe{position:absolute;border:0;background:#000}
#slide.fill iframe{top:0;left:50%;height:100%;width:177.78dvh;transform:translateX(-50%)}
#slide.fit iframe{top:50%;left:0;width:100%;height:56.25vw;transform:translateY(-50%)}
#touch{position:absolute;inset:0;z-index:2}
#ui button{position:absolute;z-index:3;width:46px;height:46px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(18,18,22,.5);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .1s,background .15s}
#ui button:active{transform:scale(.92)}

#ui svg,#b-clean svg,#lh svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
#b-clean svg{width:18px;height:18px}#b-clean .sl{display:none}#stage.clean #b-clean .sl{display:block}

#b-fit{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
#b-shuf{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
#b-aud{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 210px)}
#stage.aud #slide iframe{top:50%;left:50%;width:96px;height:54px;transform:translate(-50%,-50%);opacity:.6;border-radius:8px}
#audlbl{display:none;position:absolute;z-index:1;left:0;right:0;top:calc(50% + 48px);text-align:center;color:#aaa;font-size:15px;pointer-events:none}
#stage.aud #audlbl{display:block}
#flash{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#flash svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#flash.show{opacity:.9;transform:translate(-50%,-50%) scale(1)}
#hint{position:absolute;z-index:3;left:50%;transform:translateX(-50%);max-width:86%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center;color:#fff;font-size:14px;padding:8px 14px;border-radius:14px;background:rgba(0,0,0,.5);pointer-events:none;transition:opacity .6s}
#b-list{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 270px)}
#b-pip{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 330px)}
#b-pip:disabled{opacity:.35;cursor:wait}
#listTabs{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #2a2d35}
.list-tab{flex:1;min-height:40px;border:1px solid #343741;border-radius:12px;background:#17191e;color:#c9cbd2;font:inherit;font-size:14px;font-weight:700}
.list-tab.on{background:linear-gradient(135deg,#ff4468,#ff7a45);border-color:transparent;color:#fff}
#pipVideo{position:fixed;left:0;top:0;width:320px;height:180px;opacity:.001;pointer-events:none;z-index:4;background:#000}
#b-clean{position:absolute;z-index:4;right:17px;bottom:calc(env(safe-area-inset-bottom,0px) + 35px);width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(18,18,22,.35);color:#fff;opacity:.5;padding:0;display:flex;align-items:center;justify-content:center}
#stage.clean #ui,#stage.clean #bar{display:none}
#list{position:absolute;inset:0;z-index:6;background:#0b0b0d;display:none;flex-direction:column;direction:rtl;color:#f1f2f5}
#list.open{display:flex}
#lh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;font-weight:700;font-size:17px;border-bottom:1px solid #2a2d35}
#lh button{width:40px;height:40px;border-radius:50%;border:0;background:#26282e;color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
#rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.row{display:flex;gap:12px;align-items:center;padding:8px 16px;content-visibility:auto;contain-intrinsic-size:auto 66px}
.row.cur{background:#1d2026;box-shadow:inset -3px 0 0 var(--ac)}
.row img{width:88px;height:50px;object-fit:cover;border-radius:6px;background:#1a1c21;flex:none}
.row span{font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.row i{font-style:normal;color:#8a8f9a;font-size:12px;width:26px;flex:none;text-align:center}
#bar{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 12px);left:72px;right:12px;height:48px;display:flex;align-items:center;gap:10px;direction:ltr}
#trk{flex:1;height:40px;display:flex;align-items:center;touch-action:none;cursor:pointer}
#tk{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
#pf{height:100%;background:var(--ac);transform-origin:left;transform:scaleX(0);will-change:transform}
#tm{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;min-width:92px;text-align:center;padding:4px 8px;border-radius:10px;background:rgba(0,0,0,.4)}
@media (orientation:portrait){
#stage.land{inset:auto;top:0;left:0;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100dvw) rotate(90deg)}
#stage.land:not(.aud) #slide.fill iframe{width:177.78dvw}
#stage.land:not(.aud) #slide.fit iframe{height:56.25dvh}
}

#setup{max-width:560px;justify-content:flex-start;padding-top:28px}
#searchArea{width:100%;display:flex;flex-direction:column;gap:8px}
#searchLine{display:flex;gap:8px;direction:ltr;align-items:stretch}
#searchInput{flex:1;min-width:0}
#searchBtn{flex:none;border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,#ff4468,#ff7a45);color:#fff;font:inherit;font-weight:700}
#searchBtn:active{transform:scale(.98)}
#suggestions{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.08)}
#suggestions[hidden]{display:none}
.suggestion{display:block;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--fg);text-align:start;font:inherit;font-size:14px;cursor:pointer}
.suggestion:last-child{border-bottom:0}
.suggestion:active{background:var(--bg)}
#searchStatus{font-size:13px;color:var(--mut);min-height:0}
#results{display:flex;flex-direction:column;gap:8px;max-height:39vh;overflow:auto;overscroll-behavior:contain}
.search-result{width:100%;display:flex;gap:11px;align-items:center;text-align:start;padding:8px;border:1px solid var(--bd);border-radius:13px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;min-width:0}

.result-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.result-title{font-size:13px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-meta{font-size:11px;color:var(--mut);line-height:1.35}
.orLabel{font-size:12px;color:var(--mut);text-align:center;margin:2px 0 -4px}
@media(max-height:700px){#setup{justify-content:flex-start;padding-top:16px}#results{max-height:30vh}.logo{width:52px;height:52px;border-radius:16px}.logo svg{width:26px;height:26px}h1{font-size:23px}}
@media(max-width:380px){.search-result img{width:96px;height:54px}#searchBtn{padding:0 13px}}
@media (prefers-reduced-motion: reduce){#flash{transition:none}}

    var p=parse(txt);
    if(!p){$('err').textContent=tr('bad');return}
    $('err').textContent='';ls('txt',txt);start(p);
  }
  $('go').onclick=function(){run($('url').value)};
  $('paste').onclick=function(){
    if(!navigator.clipboard||!navigator.clipboard.readText){$('err').textContent=tr('noclip');return}
    navigator.clipboard.readText().then(function(t){$('url').value=t;run(t)},function(){$('err').textContent=tr('clipdeny')});
  };
  var saved=ls('txt');
  if(saved)$('url').value=saved;
  if(ls('fill')==='0'){fill=false;slide.className='fit'}
  if(ls('shuf')==='1'){shuffle=true;$('b-shuf').classList.add('on')}
  $('b-aud').onclick=function(){var on=stage.classList.toggle('aud');this.classList.toggle('on',on);ls('aud',on?'1':'0');if(on)cmd('setPlaybackQuality',['tiny'])};
  if(ls('aud')==='1'){stage.classList.add('aud');$('b-aud').classList.add('on')}
  $('b-list').onclick=function(){switchListTab('playlist');$('list').classList.add('open');var c=$('rows').querySelector('.cur');if(c)c.scrollIntoView({block:'center'})};
  $('tabPlaylist').onclick=function(){switchListTab('playlist')};
  $('tabRecommendations').onclick=function(){switchListTab('recommendations')};
  $('b-pip').onclick=requestPip;
  $('lclose').onclick=closeList;
  $('lang').onclick=function(){setLang(lang==='en'?'ar':'en')};
  $('b-clean').onclick=function(){stage.classList.toggle('clean')};
  var trk=$('trk');
  function tpos(e){var r=trk.getBoundingClientRect();var u=rot()?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;return Math.max(0,Math.min(1,u))*dur}
  trk.addEventListener('pointerdown',function(e){if(!dur)return;drag=true;try{trk.setPointerCapture(e.pointerId)}catch(x){}paint(tpos(e))});
  trk.addEventListener('pointermove',function(e){if(drag)paint(tpos(e))});
  trk.addEventListener('pointerup',function(e){if(!drag)return;drag=false;seek(tpos(e))});
  trk.addEventListener('pointercancel',function(){drag=false});
  $('rows').addEventListener('click',function(e){
    var r=e.target.closest('.row');if(!r)return;
    if(r.dataset.rec==='1') {
      var rid=r.dataset.id;saveTitle(rid,r.querySelector('span span')?r.querySelector('span span').textContent:tr('video'));
      start({list:null,vids:[rid]},true);closeList();return;
    }
    var listItems=playlistIds.length?playlistIds:ids,index=+r.dataset.i;
    if(!listItems[index])return;
    preserveSavedPlaylist=false;ids=listItems.slice();cur=index;currentVideoId=listItems[index];
    if(originalPlaylistId)cmd('loadPlaylist',[originalPlaylistId,index,0,'small']);
    else if(listItems.length>1)cmd('loadPlaylist',[listItems,index,0,'small']);
    else cmd('loadVideoById',[listItems[index],0,'small']);
    setCurrentVideo(listItems[index],title(listItems[index])||'');playing=true;closeList();
  });
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</body>
</html>
